apiVersion: v1
kind: Pod
metadata:
  name: readiness-demo
  namespace: scenario-readiness
  labels:
    app: readiness-demo
spec:
  containers:
    - name: readiness-demo
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - "touch /tmp/healthy; sleep 3600"
      readinessProbe:
        exec:
          command:
            - cat
            - /tmp/healthy
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 1
        failureThreshold: 3