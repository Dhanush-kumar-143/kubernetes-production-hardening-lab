apiVersion: v1
kind: Pod
metadata:
  name: pending-demo
  namespace: scenario-pending
spec:
  containers:
    - name: pending-demo
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - "sleep 3600"
      resources:
        requests:
          memory: "32Mi"
          cpu: "100m"