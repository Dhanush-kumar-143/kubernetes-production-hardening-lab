apiVersion: v1
kind: Pod
metadata:
  name: liveness-demo
  namespace: scenario-liveness
  labels:
    app: liveness-demo
spec:
  restartPolicy: Always
  containers:
    - name: liveness-demo
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - "touch /tmp/healthy; sleep 3600"
      livenessProbe:
        exec:	
          command:
            - cat
            - /tmp/healthy
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 1
        failureThreshold: 3